name: TDR Tag and pre deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions: {}
jobs:
  pre-deploy:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@b98899c2acfaf872e0053671743a5b1284b0dab0 # v0.0.43
    with:
      repo-name: tdr-backend-checks-results
      lambda-name: backend-checks-results
      artifact-name: function
      artifact-file-type: zip
      artifact-path: .
      build-command: |
        cd src
        zip  ../function.zip lambda_handler.py
        cd ..
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh workflow run deploy.yml -f environment=intg -f to-deploy="$NEXT_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
